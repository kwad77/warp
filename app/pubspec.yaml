name: wanderpost
description: "Wanderpost — a location-based collection game."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

# SPEC §1 mobile dependency allowlist. Anything else requires a SPEC edit in the same PR.
# camera + google_mlkit_face_detection are pre-approved (product brief) and land here in
# M1 step 4 (SPEC §13.1) alongside the code that uses them. image_picker and geolocator
# are step-4 additions flagged in SPEC §1/§13.1 — image_picker for the gallery path §6
# allows for POI-creation photos only (camera's own plugin surface has no library
# picker); geolocator because nothing in this allowlist previously read a GPS fix at all,
# and both POI creation and check-in need one. crypto (dart-lang official, SPEC §13.2) is
# the SHA-256 capture token — already a transitive dep, promoted since we call it directly.
dependencies:
  flutter:
    sdk: flutter
  maplibre_gl: ^0.21.0
  flutter_riverpod: ^2.6.1
  dio: ^5.7.0
  freezed_annotation: ^2.4.4
  flutter_secure_storage: ^9.2.2
  camera: ^0.11.0+2
  google_mlkit_face_detection: ^0.13.1
  image_picker: ^1.1.2
  geolocator: ^13.0.2
  crypto: ^3.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  freezed: ^2.5.7

flutter:
  uses-material-design: true
